name: Dynatrace OneAgent
version: "1.1.5"
slug: dynatrace_oneagent
description: Dynatrace OneAgent infrastructure monitoring for Home Assistant OS
url: https://github.com/beelieve-ai/ha-dynatrace/tree/main/dynatrace-oneagent
arch:
  - aarch64
  - amd64
init: false
startup: system
boot: auto
host_network: true
host_pid: true
host_ipc: true
apparmor: false
# Dynatrace requires its containerized OneAgent to run in Docker privileged
# mode. In Home Assistant Supervisor this is expressed as full_access and only
# takes effect after the user disables Protection mode for the add-on.
full_access: true
# Keep the capabilities explicit as well. Supervisor 2026.7 exposes the
# full-access hardware flag independently and does not retain SYS_ADMIN for
# this add-on without the explicit declaration; the storage bind mounts then
# fail with EPERM before OneAgent can start.
privileged:
  - SYS_ADMIN
  - SYS_PTRACE
  - SYS_RESOURCE
  - SYS_NICE
  - NET_ADMIN
  - NET_RAW
  - DAC_READ_SEARCH
  - IPC_LOCK
options:
  environment_url: null
  paas_token: null
  monitoring_mode: infra-only
  installer_arch: aarch64
  log_monitoring: true
  host_group: ""
  additional_args: ""
schema:
  environment_url: url
  paas_token: password
  monitoring_mode: list(infra-only|fullstack|discovery)
  installer_arch: list(aarch64|amd64)
  log_monitoring: bool
  host_group: str?
  additional_args: str?
